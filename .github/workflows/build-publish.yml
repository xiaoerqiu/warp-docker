name: Build and publish Docker image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      GOST_VERSION:
        description: "Version of gost. If empty, the latest version will be used."
        required: false
        type: string
      FORCE:
        description: "Build even if an image with these versions already exists."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: build-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      GOST_VERSION: ${{ steps.versions.outputs.GOST_VERSION }}
      WARP_VERSION: ${{ steps.versions.outputs.WARP_VERSION }}
      BUILD: ${{ steps.exists.outputs.BUILD }}
    steps:
      # scheduled workflows are disabled after 60 days without repository activity
      - name: Keep schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable build-publish.yml --repo "$GITHUB_REPOSITORY"

      - name: Get versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_GOST_VERSION: ${{ github.event.inputs.GOST_VERSION }}
        run: |
          GOST_VERSION="$INPUT_GOST_VERSION"
          if [ -z "$GOST_VERSION" ]; then
            GOST_VERSION=$(gh api repos/go-gost/gost/releases/latest --jq .tag_name | cut -c 2-)
          fi
          # gost version must be <number>.<number>.<number>
          if [[ ! "$GOST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid gost version: $GOST_VERSION"
            exit 1
          fi
          # same release as the ubuntu:22.04 base image
          WARP_VERSION=$(curl -fsS https://pkg.cloudflareclient.com/dists/jammy/main/binary-amd64/Packages \
            | awk '/^Package: cloudflare-warp$/{f=1} f&&/^Version:/{print $2; f=0}' | sort -V | tail -1)
          if [ -z "$WARP_VERSION" ]; then
            echo "Cannot find WARP version"
            exit 1
          fi
          echo "GOST_VERSION=$GOST_VERSION" >> "$GITHUB_OUTPUT"
          echo "WARP_VERSION=$WARP_VERSION" >> "$GITHUB_OUTPUT"
          echo "WARP $WARP_VERSION, GOST $GOST_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Log into registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the slim image is pushed last, so its tag means the whole build finished
      - name: Check for existing image
        id: exists
        env:
          FORCE: ${{ github.event.inputs.FORCE }}
          TAG: slim-${{ steps.versions.outputs.WARP_VERSION }}-${{ steps.versions.outputs.GOST_VERSION }}
        run: |
          if [ "$FORCE" != "true" ] && docker manifest inspect "${IMAGE,,}:$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "BUILD=false" >> "$GITHUB_OUTPUT"
          else
            echo "BUILD=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.BUILD == 'true'
    runs-on: ubuntu-latest
    env:
      GOST_VERSION: ${{ needs.check.outputs.GOST_VERSION }}
      WARP_VERSION: ${{ needs.check.outputs.WARP_VERSION }}
      TAG: ${{ needs.check.outputs.WARP_VERSION }}-${{ needs.check.outputs.GOST_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for test
        uses: docker/build-push-action@v5
        with:
          build-args: |
            GOST_VERSION=${{ env.GOST_VERSION }}
            WARP_VERSION=${{ env.WARP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
          context: .
          platforms: linux/amd64
          load: true
          tags: warp-test:default

      - name: Build slim image for test
        uses: docker/build-push-action@v5
        with:
          build-args: |
            GOST_VERSION=${{ env.GOST_VERSION }}
            WARP_VERSION=${{ env.WARP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BASE_IMAGE=debian:bookworm-slim
          context: .
          platforms: linux/amd64
          load: true
          tags: warp-test:slim

      - name: Smoke test
        run: .github/smoke-test.sh warp-test:default "$WARP_VERSION" "$GOST_VERSION"

      - name: Smoke test slim
        run: .github/smoke-test.sh warp-test:slim "$WARP_VERSION" "$GOST_VERSION"

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          build-args: |
            GOST_VERSION=${{ env.GOST_VERSION }}
            WARP_VERSION=${{ env.WARP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}

      - name: Build and push slim variant
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          build-args: |
            GOST_VERSION=${{ env.GOST_VERSION }}
            WARP_VERSION=${{ env.WARP_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BASE_IMAGE=debian:bookworm-slim
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:slim-latest
            ${{ env.IMAGE }}:slim-${{ env.TAG }}
            ${{ env.IMAGE }}:slim-${{ env.TAG }}-${{ github.sha }}
